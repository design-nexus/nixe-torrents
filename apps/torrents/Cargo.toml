[package]
name = "nixe-torrents"
version = "0.1.0"
description = "A BitTorrent client for Omarchy, built on libtorrent"
license = "MIT"
repository = "https://github.com/design-nexus/nixe-torrents"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nixe-torrents"
path = "src/main.rs"

[dependencies]
nixe-core = { git = "https://github.com/design-nexus/nixe-core.git", rev = "e4595e68a4fd9b44bd15e95311ace1d0fb669bc4" }
nixe-ui = { git = "https://github.com/design-nexus/nixe-design.git", rev = "0319940fb27bb5fc7f04742bcb2bd331b384c425" }
nixe-theme = { git = "https://github.com/design-nexus/nixe-design.git", rev = "0319940fb27bb5fc7f04742bcb2bd331b384c425" }
anyhow = "1.0.104"
async-channel = "2"
cxx = "1"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[build-dependencies]
cxx-build = "1"
pkg-config = "0.3"
