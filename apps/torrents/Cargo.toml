[package]
name = "nyx-torrents"
version = "0.1.0"
description = "A BitTorrent client for Omarchy, built on libtorrent"
license = "MIT"
repository = "https://github.com/design-nexus/nyx-torrents"
authors = ["Ken Smith"]
edition = "2024"

[[bin]]
name = "nyx-torrents"
path = "src/main.rs"

[dependencies]
nyx-core = { git = "https://github.com/design-nexus/nyx-core.git", rev = "52cba5e27a3dd5f00c780f53e423302b4b5f9c9c" }
nyx-ui = { git = "https://github.com/design-nexus/nyx-design.git", rev = "34e9acee71ea9af4e87a43a678f98048dccdbfdb" }
nyx-theme = { git = "https://github.com/design-nexus/nyx-design.git", rev = "34e9acee71ea9af4e87a43a678f98048dccdbfdb" }
anyhow = "1.0.104"
async-channel = "2"
cxx = "1"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[build-dependencies]
cxx-build = "1"
pkg-config = "0.3"
